[project]
name = "py-part-recipe"
version = "0.1.0"
description = "A partition manager based on yaml recipe for linux"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Frederic Laurencin" }]
requires-python = ">=3.10"
keywords = ["partitioning", "disk", "raid", "lvm", "mdadm", "installer", "gpt"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Filesystems",
    "Topic :: System :: Installation/Setup",
]
dependencies = [
    "pyparted>=3.13.0",
    "pyyaml>=6.0.1",
]

[project.scripts]
py-part-recipe = "py_part_recipe.cli:main"

[dependency-groups]
dev = [
    "black>=23.10.1",
    "pytest>=7.4.3",
    "ruff>=0.1.2",
]

# the example recipes are installed next to the package: <prefix>/share/py-part-recipe/examples
[tool.hatch.build.targets.wheel.shared-data]
"examples" = "share/py-part-recipe/examples"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
