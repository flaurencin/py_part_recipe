partitioning:
  - devices:
      - /dev/loop100
      - /dev/loop101
      - /dev/loop102
    recipe:
      keep_partitions: false
      wipe: false
      partitions:
        - min_size: 2 MiB
          max_size: 5 MiB
          weight: 5000
          p_type: normal
          flags: ["raid", "esp"]
          handle: partitions_raid_md0
        - min_size: 20 MiB
          max_size: 200 MiB
          weight: 500
          p_type: normal
          flags: ["raid"]
          handle: partitions_raid_md1
        - min_size: 20 MiB
          max_size: 2 GiB
          weight: 10
          p_type: normal
          flags: ["raid"]
          handle: partitions_raid_md2
  - devices:
      - /dev/loop103
      - /dev/loop104
      - /dev/loop105
    recipe:
      keep_partitions: false
      wipe: false
      partitions:
        - min_size: 20 MiB
          max_size: 200 MiB
          weight: 500
          p_type: normal
          flags: ["raid"]
          handle: partitions_raid_md4
        - min_size: 20 MiB
          max_size: 2 GiB
          weight: 10
          p_type: normal
          flags: ["raid"]
          handle: partitions_raid_md5
  - devices:
      - /dev/loop106
    recipe:
      keep_partitions: false
      wipe: false
      partitions:
        - min_size: 20 MiB
          max_size: 51 MiB
          weight: 100
          p_type: normal
          flags: ["boot"]
          handle: partitions_boot
        - min_size: 4 MiB
          max_size: 4 MiB
          weight: 100
          p_type: normal
          flags: ["swap"]
          handle: partitions_swap
volumes:
  - handle: volume_boot
    type: raw
    params:
      partitions_handle: partitions_boot
  - handle: volume_swap
    type: raw
    params:
      partitions_handle: partitions_swap
  - handle: volume_md0
    type: raid
    params:
      partitions_handle: partitions_raid_md0
      level: 1
      dev_indices: [0, 1]
      spare_indices: [2]
      meta_data: "1.0"
      raid_dev_name: /dev/md30
  - handle: volume_md1
    type: raid
    params:
      partitions_handle: partitions_raid_md1
      level: 1
      dev_indices: [0, 1]
      spare_indices: [2]
      meta_data: "1.0"
      raid_dev_name: /dev/md31
  - handle: volume_md2
    type: raid
    params:
      partitions_handle: partitions_raid_md2
      level: 1
      dev_indices: [0, 1]
      spare_indices: [2]
      meta_data: "1.0"
      raid_dev_name: /dev/md32
  - handle: volume_md4
    type: raid
    params:
      partitions_handle: partitions_raid_md4
      level: 1
      dev_indices: [0, 1]
      spare_indices: [2]
      meta_data: "1.0"
      raid_dev_name: /dev/md34
  - handle: volume_md5
    type: raid
    params:
      partitions_handle: partitions_raid_md5
      level: 1
      dev_indices: [0, 1]
      spare_indices: [2]
      meta_data: "1.0"
      raid_dev_name: /dev/md35
  - handle: volume_vg_root
    type: volume_group
    params:
      partitions_handles: []
      volumes_handles:
        - volume_md1
        - volume_md4
  - handle: volume_vg_var
    type: volume_group
    params:
      partitions_handles: []
      volumes_handles:
        - volume_md2
        - volume_md5
  - handle: volume_lv_root
    type: logical_volume
    params:
      volume_handle: volume_vg_root
      vg_percent: 60
  - handle: volume_lv_home
    type: logical_volume
    params:
      volume_handle: volume_vg_root
      vg_percent: 20
  - handle: volume_lv_var
    type: logical_volume
    params:
      volume_handle: volume_vg_var
      vg_percent: 80
file_systems:
  # mount is the mount point in the installed system, the directory where
  # it is mounted (/target...) is chosen when mounting
  - type: ext4
    format: true
    volume_handle: volume_lv_root
    mount: /
  - type: ext4
    format: true
    volume_handle: volume_lv_var
    mount: /var
  - type: ext4
    format: true
    volume_handle: volume_lv_home
    mount: /home
    mount_options: noatime
  - type: ext3
    format: true
    volume_handle: volume_boot
    mount: /boot
  - type: fat32
    format: true
    volume_handle: volume_md0
    mount: /boot/efi
    mount_options: umask=0077
  - type: swap
    format: true
    volume_handle: volume_swap
